# Cargo-Workspace: mehrere Rust-Crates teilen sich ein Cargo.lock und ein target/-Verzeichnis.
#   crates/bootforge-core  -> die eigentliche Logik (Katalog, Download, Flashen ...), OHNE Tauri
#   src-tauri              -> die Desktop-App (dünne Schicht: Tauri-Commands + Events)
# Später kommt noch ein kleiner Flash-Helper dazu (läuft unter Linux via pkexec mit Root-Rechten).
[workspace]
resolver = "3"
members = ["crates/bootforge-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/xHellPhoenix/bootforge"
rust-version = "1.85"

[workspace.dependencies]
bootforge-core = { path = "crates/bootforge-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
url = { version = "2", features = ["serde"] }
schemars = "1"
# HTTP-Client. Standard-TLS ist in 0.13 rustls (in Rust geschrieben) statt OpenSSL:
# gleiches Verhalten unter Windows und Linux, keine OpenSSL-Version, die zur Distro passen muss.
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "signal", "sync", "time"] }
percent-encoding = "2"
sha2 = "0.11"
md-5 = "0.11"
# OpenPGP ohne Standard-Features: das Krypto-Backend wählt jedes Crate pro Betriebssystem selbst.
sequoia-openpgp = { version = "2", default-features = false }
