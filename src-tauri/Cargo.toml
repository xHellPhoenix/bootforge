[package]
name = "bootforge"
description = "BootForge – USB-Boot-Sticks ohne ISO-Suche"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# Tauri v2 legt die App-Logik in eine Bibliothek (main.rs ruft nur `run()` auf).
# Das ist v2-Standard und nötig für Mobile – für uns hält es main.rs einfach schlank.
name = "bootforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bootforge-core.workspace = true
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
