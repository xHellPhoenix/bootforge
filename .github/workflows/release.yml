# Release bauen: `git tag v0.1.0 && git push origin v0.1.0`
#
# Ergebnis ist ein **Entwurf** (Draft-Release) mit
# - Windows: NSIS-Installer (.exe) und MSI, beide mit wimlib,
# - Linux: .deb und .rpm (mit Root-Helper und polkit-Regel),
# - wimlib-Quelltext (GPL verlangt, ihn mit den Programmen anzubieten),
# - SHA256SUMS.txt über alle Dateien.
# Veröffentlicht wird der Entwurf von Hand, nachdem man ihn kurz geprüft hat.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 22.04 statt 24.04: Das .deb hängt dann von älteren Bibliotheksversionen ab
        # und läuft auch auf 22.04 und Debian 12.
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Linux-Abhängigkeiten
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev nettle-dev clang

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Baut über `tauri build` (inkl. beforeBuildCommand: Helper bzw. wimlib) und lädt die Pakete
      # in den Release-Entwurf zum Tag.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: SealFlash ${{ github.ref_name }}
          releaseBody: |
            Installationsanleitung: siehe README. Prüfsummen aller Dateien: SHA256SUMS.txt.
          releaseDraft: true
          prerelease: false
          # Windows: zusätzlich wimlib laden (Hash-geprüft) und in den Installer packen.
          args: ${{ runner.os == 'Windows' && '--config src-tauri/tauri.windows-release.conf.json' || '' }}

  wimlib-source:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: wimlib-Quelltext laden und prüfen
        run: |
          curl -fsSLO https://wimlib.net/downloads/wimlib-1.14.5.tar.gz
          echo "84221a3abd5b91228f15f8e6065c335a336237b5738197b75bf419eea561a194  wimlib-1.14.5.tar.gz" | sha256sum -c -
      - name: Zum Release hinzufügen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" wimlib-1.14.5.tar.gz --clobber --repo "${{ github.repository }}"

  checksums:
    needs: [build, wimlib-source]
    runs-on: ubuntu-latest
    steps:
      - name: Prüfsummen aller Release-Dateien
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir assets && cd assets
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --skip-existing
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "${{ github.ref_name }}" SHA256SUMS.txt --clobber --repo "${{ github.repository }}"
